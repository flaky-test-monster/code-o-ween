name: PR preview

# Deploys each pull request's docs/ to gh-pages under pr-preview/pr-<number>/,
# comments the preview link on the PR, and removes the preview when the PR closes.
# Actions are pinned to commit SHAs, like in pages.yml.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths: ["docs/**", ".github/workflows/preview.yml"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy PR preview
    # Fork PRs get a read-only token and could not push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: docs
          preview-branch: gh-pages
          umbrella-dir: pr-preview
